openapi: 3.1.0
info:
  title: crm-churn-demo API
  version: 0.3.0
  description: |
    Contract for the pitch demo. Lanes C (service) and D (UI) both code against this
    file; neither may add a field unilaterally. Probabilities come from the LightGBM model
    in ml/artifacts, drivers from SHAP, counterfactuals from re-scoring the same model.

    Entity model: company -> leads (initiatives) -> won initiative. There is no renewal
    event, so the target is lead win probability, not contract churn. Pilot scope is
    Italy, five macro-regions.
servers:
  - url: http://localhost:8000

paths:
  /api/health:
    get:
      operationId: health
      summary: Liveness plus the loaded model version
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status, model_version, scored_at]
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  model_version: { type: string }
                  scored_at: { type: string, format: date-time }

  /api/pipeline:
    get:
      operationId: getPipeline
      summary: Open leads ranked by expected value (probability x proposed ARR)
      parameters:
        - { name: region, in: query, schema: { $ref: '#/components/schemas/Region' } }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
        - name: min_probability
          in: query
          schema: { type: number, minimum: 0, maximum: 1, default: 0 }
        - name: sort
          in: query
          description: expected_value (default) chases the biggest wins; at_risk flips to (1-p) x ARR
          schema: { type: string, enum: [expected_value, at_risk], default: expected_value }
      responses:
        '200':
          description: Ranked pipeline
          content:
            application/json:
              schema:
                type: object
                required: [items, total, total_expected_value]
                properties:
                  total: { type: integer }
                  total_expected_value: { type: number }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PipelineItem' }

  /api/leads/{lead_id}:
    get:
      operationId: getLead
      summary: Lead 360 with company context, score, drivers, and open actions
      parameters:
        - { name: lead_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Lead detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadDetail' }
        '404':
          description: Unknown lead
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/leads/{lead_id}/counterfactual:
    post:
      operationId: postCounterfactual
      summary: Re-score the same model under a hypothetical action on an open lead
      parameters:
        - { name: lead_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CounterfactualRequest' }
      responses:
        '200':
          description: Beside comparison of current and hypothetical probability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CounterfactualResponse' }
        '422':
          description: Unsupported lever, or a lead already closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/leads/{lead_id}/actions:
    post:
      operationId: postAction
      summary: Record a retention action and return the re-scored probability
      parameters:
        - { name: lead_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionRequest' }
      responses:
        '201':
          description: Action created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResponse' }

  /api/companies/{company_id}:
    get:
      operationId: getCompany
      summary: Company 360 — initiative history, dormancy flag, relationship signals
      parameters:
        - { name: company_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Company detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyDetail' }
        '404':
          description: Unknown company

  /api/portfolio:
    get:
      operationId: getPortfolio
      summary: Executive view — pipeline and win rate by region, calibration, drift
      responses:
        '200':
          description: Portfolio aggregates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Portfolio' }

components:
  schemas:
    Region:
      type: string
      description: Italian macro-region of the company
      enum: [nord-ovest, nord-est, centro, sud, isole]

    Band:
      type: string
      enum: [low, medium, high, critical]

    Source:
      type: string
      enum: [inbound, outbound, referral, partner, event]

    Driver:
      type: object
      required: [feature, label, contribution, value, direction]
      properties:
        feature: { type: string }
        label: { type: string, description: Human-readable, executive-safe wording }
        contribution: { type: number, description: SHAP value in log-odds }
        value: { type: string, description: Rendered value, e.g. "11 hours to first response" }
        direction: { type: string, enum: [increases, decreases] }

    Lead:
      type: object
      required: [id, status, source, created_at, amount_arr]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [new, contacted, qualified, proposal, won, lost]
        source: { $ref: '#/components/schemas/Source' }
        created_at: { type: string, format: date }
        closed_at: { type: [string, 'null'], format: date }
        amount_arr: { type: [number, 'null'] }
        discount_pct: { type: number }
        lost_reason:
          type: [string, 'null']
          enum: [price, no_budget, competitor, no_fit, timing, silent, null]

    PipelineItem:
      type: object
      required: [lead_id, company_name, region, source, status, amount_arr, probability, band, expected_value, days_open, top_driver]
      properties:
        lead_id: { type: string }
        company_name: { type: string }
        region: { $ref: '#/components/schemas/Region' }
        source: { $ref: '#/components/schemas/Source' }
        status: { type: string }
        amount_arr: { type: number }
        probability: { type: number }
        band: { $ref: '#/components/schemas/Band' }
        expected_value: { type: number, description: probability * amount_arr }
        days_open: { type: integer }
        top_driver: { $ref: '#/components/schemas/Driver' }

    LeadDetail:
      type: object
      required: [lead, company, score, drivers, prior_initiatives, open_actions]
      properties:
        lead: { $ref: '#/components/schemas/Lead' }
        company:
          type: object
          required: [id, name, region, industry, employees, lifetime_won_arr, dormant]
          properties:
            id: { type: string }
            name: { type: string }
            region: { $ref: '#/components/schemas/Region' }
            industry: { type: string }
            employees: { type: integer }
            lifetime_won_arr: { type: number }
            dormant:
              type: boolean
              description: True when no new initiative has been proposed for 180+ days
        score:
          type: object
          required: [probability, band, model_version, scored_at, expected_value]
          properties:
            probability: { type: number }
            band: { $ref: '#/components/schemas/Band' }
            model_version: { type: string }
            scored_at: { type: string, format: date-time }
            expected_value: { type: number }
        drivers:
          type: array
          items: { $ref: '#/components/schemas/Driver' }
        prior_initiatives:
          type: array
          description: The company's earlier initiatives, most recent first
          items: { $ref: '#/components/schemas/Lead' }
        open_actions:
          type: array
          items: { $ref: '#/components/schemas/Action' }

    CompanyDetail:
      type: object
      required: [company, initiatives, signals]
      properties:
        company:
          type: object
          required: [id, name, region, industry, employees, created_at]
          properties:
            id: { type: string }
            name: { type: string }
            region: { $ref: '#/components/schemas/Region' }
            industry: { type: string }
            employees: { type: integer }
            created_at: { type: string, format: date }
        initiatives:
          type: array
          items: { $ref: '#/components/schemas/Lead' }
        signals:
          type: object
          required: [dormant, days_since_last_initiative, won, lost, lifetime_won_arr]
          properties:
            dormant: { type: boolean }
            days_since_last_initiative: { type: integer }
            won: { type: integer }
            lost: { type: integer }
            lifetime_won_arr: { type: number }

    CounterfactualRequest:
      type: object
      description: |
        Forward-looking levers only; nothing rewrites a response that already happened.
        Each is re-scored by the same model.

        There is deliberately no `accelerate_to_proposal` lever: the model trains on leads
        labelled at qualification, so `stage_at_scoring` is constant in training and the
        proposal-stage effect is unlearnable. A lever the model cannot see would be a
        fabricated number on screen. See `docs/DECISIONS.md` for the fix path.
      properties:
        exec_sponsor_meeting: { type: boolean }
        discovery_meeting: { type: boolean }
        discount_pct: { type: number, minimum: 0, maximum: 60 }
      additionalProperties: false

    CounterfactualResponse:
      type: object
      required: [current_probability, hypothetical_probability, delta, explanation]
      properties:
        current_probability: { type: number }
        hypothetical_probability: { type: number }
        delta: { type: number, description: hypothetical minus current }
        explanation: { type: string }

    ActionRequest:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [call, exec_sponsor_meeting, discovery_meeting, discount_review]
        note: { type: string, maxLength: 500 }
      additionalProperties: false

    Action:
      type: object
      required: [id, kind, status, created_at, created_by]
      properties:
        id: { type: string }
        kind: { type: string }
        status: { type: string, enum: [open, done, cancelled] }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
        note: { type: string }

    ActionResponse:
      type: object
      required: [action, probability_after, delta]
      properties:
        action: { $ref: '#/components/schemas/Action' }
        probability_after: { type: number }
        delta: { type: number }

    Portfolio:
      type: object
      required: [total_expected_value, by_region, calibration, drift]
      properties:
        total_expected_value: { type: number }
        by_region:
          type: array
          items:
            type: object
            required: [region, open_leads, win_rate, expected_value]
            properties:
              region: { $ref: '#/components/schemas/Region' }
              open_leads: { type: integer }
              win_rate: { type: number }
              expected_value: { type: number }
        calibration:
          type: array
          description: Decile bins for the calibration chart
          items:
            type: object
            required: [predicted, actual]
            properties:
              predicted: { type: number }
              actual: { type: number }
        drift:
          type: object
          required: [psi, status]
          properties:
            psi: { type: number }
            status: { type: string, enum: [stable, watch, alert] }

    Error:
      type: object
      required: [error, detail]
      properties:
        error: { type: string }
        detail: { type: string }
