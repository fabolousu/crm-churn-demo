name: Uptime Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  uptime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Health
        id: check
        run: |
          set -e
          # Retry loop in bash
          for i in {1..3}; do
            status_code=$(curl -s -o /dev/null -w "%{http_code}" https://crm-churn-demo.vercel.app/api/health)
            if [ "$status_code" -eq 200 ]; then
              echo "Health check passed"
              break
            fi
            echo "Attempt $i failed"
            [ "$i" -eq 3 ] && exit 1
            sleep 5
          done

      - name: Check Pipeline
        id: pipeline
        run: |
          set -e
          # Retry loop in bash
          for i in {1..3}; do
            response=$(curl -s -w "%{http_code}" -o response.json https://crm-churn-demo.vercel.app/api/pipeline?limit=1)
            if [ "$response" -eq 200 ]; then
              total=$(python3 -c "import json, sys; print(json.load(sys.stdin).get('total'))" < response.json)
              if [ "$total" -gt 0 ]; then
                echo "Pipeline check passed"
                break
              fi
            fi
            echo "Attempt $i failed"
            [ "$i" -eq 3 ] && exit 1
            sleep 5
          done

      - name: Handle Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check for existing issue
          issue_number=$(gh issue list --label uptime --json number -q '.[0].number')
          
          if [ -z "$issue_number" ]; then
            echo "Creating new issue"
            gh issue create --title "Uptime alert: production API" --body "Production API health/pipeline check failed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --label uptime
          else
            echo "Commenting on existing issue #$issue_number"
            gh issue comment "$issue_number" --body "Another failure detected. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      - name: Handle Recovery
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          issue_number=$(gh issue list --label uptime --state open --json number -q '.[0].number')
          if [ -n "$issue_number" ]; then
            echo "Closing issue #$issue_number"
            gh issue comment "$issue_number" --body "Service recovered."
            gh issue close "$issue_number"
          fi
