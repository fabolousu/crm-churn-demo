name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic:
    name: tests and model gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Tests
        run: |
          if [ -d tests ] || [ -d ml/tests ] || [ -d api/tests ]; then
            python -m pytest -q
          else
            echo "no test directories yet — failing rather than skipping"
            exit 1
          fi

      - name: Model quality gate
        run: |
          if [ -f ml/artifacts/metrics.json ]; then
            python tools/check_metrics.py
          else
            echo "ml/artifacts/metrics.json missing — the demo's numbers cannot be checked"
            exit 1
          fi

      - name: Leakage guard
        run: |
          if grep -rn "_outcomes" ml/features.py 2>/dev/null; then
            echo "features.py reads the label table"
            exit 1
          fi
          echo "leakage guard ok"

      - name: Contract drift
        run: |
          if [ -f api/openapi.yaml ] && [ -d api/tests ]; then
            python -m pytest api/tests -q -k contract
          else
            echo "contract tests not present yet"
          fi

  web-build:
    name: web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build if a web app exists
        run: |
          if [ -f web/package.json ]; then
            corepack enable
            pnpm --dir web install --frozen-lockfile
            pnpm --dir web build
          else
            echo "no web app yet"
          fi
