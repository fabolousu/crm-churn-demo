name: Deployment Smoke Test

on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke-test:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      # Run the script from the default branch, never from the deployed commit: a PR
      # could otherwise execute its own smoke code with the bypass secret in scope.
      - name: Checkout the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Run Smoke Test
        env:
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "::notice::No environment_url on this deployment; skipping."
            exit 0
          fi

          validation=0
          host=$(python3 ./scripts/validate_deployment_url.py "$DEPLOYMENT_URL") || validation=$?
          if [ "$validation" -eq 2 ]; then
            echo "::error::Cannot verify the deployment belongs to this project (VERCEL_TOKEN missing or Vercel API unreachable)."
            exit 1
          fi
          if [ "$validation" -ne 0 ]; then
            echo "::notice::Deployment URL is not an approved project HTTPS URL; skipping."
            exit 0
          fi

          if [ "$host" != "crm-churn-demo.vercel.app" ] && [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::notice::Preview deployment detected but VERCEL_AUTOMATION_BYPASS_SECRET is not set. Skipping."
            exit 0
          fi

          chmod +x ./scripts/smoke_deployment.sh
          ./scripts/smoke_deployment.sh "$DEPLOYMENT_URL"
