name: pages

# Free public showcase: the UI in fixture mode, deployed to GitHub Pages on every merge to
# main. No API, no server, no third-party account, no secret — the fixtures are committed
# (generated from the live API), so the showcase cannot drift from the product.
#
# Project page base path is /crm-churn-demo/; 404.html makes client-side routes resolve on
# a static host.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: |
          corepack enable
          pnpm --dir web install --frozen-lockfile

      - name: Build (fixtures, no API base)
        run: pnpm --dir web build --base=/crm-churn-demo/

      - name: SPA fallback
        run: cp web/dist/index.html web/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
