# Routing manifest — per-task agent selection.
#
# Consumed by the harness (passed as `args.routing`) and read by humans when a run
# needs auditing. Selection rules live in docs/ORCHESTRATION.md; this file is the
# executable form. Change a row here, not in a prompt.
#
# Rules encoded below:
#   - reviewer is never the author, and never the author's model family
#   - verifiable work goes to the cheapest agent that passes the gate
#   - irreversible work goes to the strongest reasoner and is serialized
#   - taste work goes to a human gate, because no test can adjudicate it
#
# `model` is the family actually used in this build; `tier` is the capability the task
# requires (see docs/AGENT_MODEL_POLICY.md). Where a task is `tier: reasoning` but
# `model: deepseek`, the manifest is recording the gap, not the decision: no Anthropic
# route was configured when these lanes ran, so every lane used deepseek-flash.

version: 1
reviewer_default: pr-reviewer
reviewer_human_gate: false   # true when the lead must also approve

tasks:
  - id: T1-contract
    scope: "docs/LABEL.md, data/schema.sql, api/openapi.yaml, docs/DECISIONS.md"
    agent: lead
    model: anthropic
    tier: reasoning
    reviewer: human
    gate: "human reads the contract"
    parallel_group: 0
    why: "highest leverage and irreversible; every lane codes against it"

  - id: T2-generator
    scope: "data/generator.py, data/seed.py, data/tests/"
    agent: data-engineer
    model: deepseek
    tier: workhorse
    reviewer: pr-reviewer
    gate: "win prevalence 25-30%, regional base rates plausibly ordered, no NaN"
    parallel_group: 1
    why: "statistics correctness; failures are silent and poison everything downstream"

  - id: T3-features
    scope: "ml/features.py, ml/tests/test_leakage.py"
    agent: ml-engineer
    model: deepseek
    tier: reasoning
    reviewer: pr-reviewer
    gate: "leakage test green; snapshot discipline proven by test"
    parallel_group: 1
    why: "timing logic is subtle and leakage is invisible in metrics"

  - id: T4-training
    scope: "ml/train.py, ml/explain.py, ml/artifacts/"
    agent: ml-engineer
    model: deepseek
    tier: workhorse
    reviewer: pr-reviewer
    gate: "AUC in [0.75, 0.90] (above = leakage), calibration < 0.05"
    parallel_group: 2
    why: "highest technical risk in the project"

  - id: T5-api
    scope: "api/app.py, api/tests/"
    agent: service-engineer
    model: deepseek
    tier: bulk
    reviewer: pr-reviewer
    gate: "contract tests against openapi.yaml green"
    parallel_group: 1
    why: "fully specified by the contract, therefore mechanical"

  - id: T6-ui
    scope: "web/"
    agent: ui-engineer
    model: anthropic
    tier: workhorse
    reviewer: human
    gate: "one screen reviewed by a human for legibility"
    parallel_group: 1
    why: "taste; a test cannot tell whether an executive understands it"

  - id: T7-retention
    scope: "api/retention.py, api/tests/test_retention.py"
    agent: service-engineer
    model: deepseek
    tier: bulk
    reviewer: pr-reviewer
    gate: "unit tests; no duplicate task for an open action"
    parallel_group: 1
    why: "small, mechanical, low consequence"

  - id: T8-integration
    scope: "compose.yaml, scripts/, web/ data wiring"
    agent: lead
    model: anthropic
    tier: reasoning
    reviewer: pr-reviewer
    gate: "docker compose up + click-through of all five screens"
    parallel_group: 3
    why: "cross-lane context; this is where agents diverge"

  - id: T9-review
    scope: "reports/"
    agent: triage
    model: anthropic
    tier: workhorse
    reviewer: human
    gate: "coderabbit exit 0 + deterministic checks + PR approvals"
    parallel_group: 4
    why: "adjudication, not detection; detection belongs to CodeRabbit"

  - id: T10-pitch
    scope: "docs/PITCH.md, docs/DEMO_SCRIPT.md, README.md"
    agent: lead
    model: anthropic
    tier: workhorse
    reviewer: human
    gate: "the demo runs unattended, twice"
    parallel_group: 5
    why: "writing quality is the deliverable"

  - id: T12-crm-schema
    scope: "api/migrations/, data/crm_schema.sql"
    agent: crm-backend
    model: anthropic
    tier: reasoning
    reviewer: verifier
    gate: "migration applies; all pre-existing tests stay green; ML tables untouched"
    parallel_group: 1
    why: "irreversible shape; every CRM lane codes against it"

  - id: T13-crm-rules
    scope: "api/crm/, api/tests/test_crm_rules.py"
    agent: crm-backend
    model: anthropic
    tier: workhorse
    reviewer: verifier
    gate: "spec section 15.1 acceptance tests for status/uniqueness/auto-link pass"
    parallel_group: 2
    why: "business rules whose intent tests do not capture"

  - id: T14-seed
    scope: "data/crm_seed.py, data/tests/test_crm_seed.py"
    agent: data-seeder
    model: deepseek
    tier: bulk
    reviewer: verifier
    gate: "deterministic from seed; row counts asserted; schema-valid"
    parallel_group: 2
    why: "mechanical generation, fully diffable"

  - id: T15-crm-ui
    scope: "web/src/crm/"
    agent: crm-frontend
    model: anthropic
    tier: workhorse
    reviewer: verifier
    gate: "build passes; every P0 inventory row has a component"
    parallel_group: 3
    why: "taste and executive legibility"

  - id: T16-vercel
    scope: "vercel.json, api/index.py, scripts/build_slim_db.py"
    agent: vercel-engineer
    model: google
    tier: workhorse
    reviewer: pr-reviewer
    gate: "preview deploy serves /api/health and one end-to-end request"
    parallel_group: 3
    why: "infrastructure config, verifiable by the deploy itself"

  - id: T17-verify
    scope: "docs/VERIFICATION_REPORT.md"
    agent: verifier
    model: google
    tier: workhorse
    reviewer: human
    gate: "every claim checked against a commit or test run, not a lane summary"
    parallel_group: 4
    why: "independent family from the authors it audits"

escalation:
  - trigger: "gate fails once"
    action: "same agent retries with the failure output attached"
  - trigger: "gate fails twice"
    action: "escalate one tier: deepseek -> openai -> lead; record it in the scoreboard"
  - trigger: "gate fails three times"
    action: "stop; the spec is wrong. Fix the contract, then restart the task"

# NOTE 2026-11-17: T2/T3/T4 were mapped to `google`, but the Gemini route is unusable right
# now with the installed key: the catalog model gemini-2.5-flash is retired for new users
# (HTTP 404 -> use gemini-3.8-flash), gemini-3.8-flash timed out twice at 120s, and
# gemini-3.1-pro-preview returned 429 quota. Until a Gemini call succeeds end to end, the
# ML lanes run on deepseek and the reviewer stays on anthropic so vendors still differ.
